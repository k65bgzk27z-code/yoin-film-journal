<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余韻 — 統合版へ</title><style>body{background:#f5f4ef;color:#272b29;font:16px -apple-system,sans-serif;max-width:640px;margin:12vh auto;padding:24px;line-height:1.9}a,button{display:inline-block;background:#304d40;color:white;padding:12px 20px;border:0;border-radius:8px;text-decoration:none;font:inherit}small{color:#68786c}</style><h1>余韻は、ひとつの映画棚になりました。</h1><p>映画検索・配信情報と、iPhone・Safariで共通の記録を使える統合版へ移動します。</p><p><a id="open" href="https://yoin.hayate-yoin.workers.dev/">統合版の余韻を開く</a></p><p id="local"></p><small>統合版は合言葉で開きます。旧版の端末内記録はここから確認できます。</small><script>
const destination='https://yoin.hayate-yoin.workers.dev/';
try{const records=JSON.parse(localStorage.getItem('yoin-films-v1')||'[]');if(Array.isArray(records)&&records.length){document.getElementById('local').textContent='このブラウザには旧版の記録が'+records.length+'件残っています。統合版にない記録がある場合は、旧版からバックアップして保管できます。';const a=document.createElement('a');a.href='./legacy.html';a.textContent='旧版の記録を確認・バックアップ';document.getElementById('local').append(document.createElement('br'),a);}else location.replace(destination);}catch{document.getElementById('local').textContent='このブラウザの旧データは変更していません。上のリンクから統合版を開けます。';}
</script></html>
